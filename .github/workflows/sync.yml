name: Sync WoW characters

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC)
  workflow_dispatch:          # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch from Blizzard
        env:
          BNET_ID: ${{ secrets.BNET_ID }}
          BNET_SECRET: ${{ secrets.BNET_SECRET }}
        run: python sync.py
      - name: Commit if changed
        run: |
          git config user.name "wow-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add characters.json 2>/dev/null || exit 0
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Update characters.json"
          git push
